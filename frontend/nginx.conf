# ============================================================
# BurpNake — Nginx Reverse Proxy Configuration
# /api/* → backend:8899
# /*     → React static build
# ============================================================
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Gzip sikilastirma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # SSE (Server-Sent Events) icin kritik ayarlar
        # Nginx varsayilan olarak bufferlamayı engellemez — SSE bozulur
        location /api/stream {
            proxy_pass http://backend:8899;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;  # 24 saat — SSE baglantisi acik kalsin
            chunked_transfer_encoding on;
        }

        # Tum /api/* isteklerini backend'e proxy'le
        location /api/ {
            proxy_pass http://backend:8899;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            client_max_body_size 100M;  # Buyuk HAR/XML dosya yuklemeleri icin
        }

        # React SPA — her route index.html'e yonlendir
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache: statik dosyalar uzun sure
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
